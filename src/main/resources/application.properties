spring.application.name=ti4-tracker

# Binds all interfaces by default, so phones and tablets on the same Wi-Fi can
# reach it. The startup banner prints the LAN URL to use.
server.port=8080

# --- Database -----------------------------------------------------------------
# Single file under data/. Open it in any SQLite browser to inspect or repair.
spring.datasource.url=jdbc:sqlite:data/ti4.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite serialises writers. With several people tapping at once, a larger pool
# just produces SQLITE_BUSY errors instead of throughput, so hold one connection.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=ti4-sqlite

# SQLite defaults foreign_keys to OFF per connection, which made every
# ON DELETE CASCADE in schema.sql decorative -- deleting a player would have
# left their score rows behind as orphans showing up as "unknown" in the ledger.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

# schema.sql uses CREATE TABLE IF NOT EXISTS, so running it every boot is safe.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- App ----------------------------------------------------------------------
# Both live outside the jar so cards and images can change without a rebuild.
ti4.images-dir=data/images
ti4.seed-file=data/objectives-seed.csv
ti4.factions-file=data/factions.csv
ti4.point-sources-file=data/point-sources.csv

# Board-game app on a LAN; the stack traces are for us, not attackers.
server.error.include-message=always
server.error.include-binding-errors=always

# Make the browser revalidate index.html/app.js/style.css every load instead of
# serving a stale copy. With Last-Modified present this is a cheap 304 when
# nothing changed, and it removes the "remember to hard-reload" trap after an
# edit. Card images are served by WebConfig's own handler and keep normal
# caching, so the big files are unaffected.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
